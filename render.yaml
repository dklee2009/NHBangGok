databases:
  - name: nh-stamp-db
    plan: free

services:
  - type: web
    name: nh-stamp-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nh-stamp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TOUR_API_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: USE_MOCK
        value: "false"
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: nh-stamp-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
